http {
    # Настройка limit_req_zone для хранения состояния rate limiting
    # $binary_remote_addr - ключ (IP клиента в бинарном виде)
    # zone=req_limit:10m - зона размером 10 мегабайт (может хранить около 160 тысяч состояний)
    # rate=10r/m - лимит 10 запросов в минуту
    limit_req_zone $binary_remote_addr zone=req_limit:10m rate=10r/m;

    # Настройка upstream для балансировки нагрузки
    upstream backend_servers {
        server backend1.example.com;
        server backend2.example.com;
        server backend3.example.com;
    }

    server {
        listen 80;

        location / {
            # Применение rate limiting
            # zone=req_limit - используем зону, определенную выше
            # burst=5 - разрешаем кратковременные всплески до 5 запросов сверх лимита (с задержкой)
            # nodelay - не задерживать запросы сверх burst, сразу возвращать 429
            limit_req zone=req_limit burst=5 nodelay;
            
            # Возвращать 429 при превышении лимита
            limit_req_status 429;

            proxy_pass http://backend_servers;
        }
    }
}
